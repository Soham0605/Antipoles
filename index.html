<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Antipode Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #ui-container {
            text-align: center;
            padding: 15px;
            background-color: #111;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 10;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        
        h2 { margin: 0 0 5px 0; }
        p { margin: 5px 0; color: #ccc; }
        
        #controls {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }

        input {
            width: 120px;
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: white;
            text-align: center;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            background-color: dodgerblue;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover { background-color: #1e90ff; }

        #locate-btn {
            background-color: #28a745;
        }
        #locate-btn:hover {
            background-color: #218838;
        }

        #cursor-readout {
            font-family: monospace;
            color: #00ff00;
            margin-top: 5px;
            font-size: 14px;
            min-height: 20px;
        }

        #map-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
            box-sizing: border-box;
            padding: 10px;
        }

        #map-container svg {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 100%;
            cursor: grab;
        }
        #map-container svg:active { cursor: grabbing; }
        
        .graticule {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 0.5px;
        }
        
        /* New styles for the city dots */
        .city-point { fill: #00ff00; stroke: #000; stroke-width: 0.5px; }
        .anti-city-point { fill: magenta; stroke: #000; stroke-width: 0.5px; }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2>Earth Antipode Viewer</h2>
        <p><strong>Drag</strong> to rotate | <strong>Single Click</strong> to fly to Antipode | <strong>Double Click</strong> to toggle Flat/Sphere</p>
        
        <div id="controls">
            <!-- Inputs changed from type="number" to type="text" to accept DMS strings -->
            <label>Lat: <input type="text" id="lat-input" placeholder="e.g. 40° 40' 12&quot; N"></label>
            <label>Lon: <input type="text" id="lon-input" placeholder="e.g. 73° 56' 24&quot; W"></label>
            <button id="go-btn">Find Antipode</button>
            <button id="locate-btn">Use My Location</button>
        </div>
        
        <div id="cursor-readout">Cursor: Lat --, Lon --</div>
    </div>

    <div id="map-container"></div>

    <script>
        // --- DMS Coordinate Parser ---
        // Converts strings like '40° 40' 12" N' or '-40.5' into clean decimal degrees
        function parseCoordinate(coordStr) {
            if (!coordStr) return NaN;
            coordStr = coordStr.trim().toUpperCase();
            
            // Check if it's already a standard decimal number
            let floatVal = parseFloat(coordStr);
            if (!isNaN(floatVal) && /^-?\d+(\.\d+)?$/.test(coordStr)) {
                return floatVal;
            }

            // Regex to match Degrees, Minutes, Seconds, and Direction (N/S/E/W)
            const dmsRegex = /^(-?\d+(?:\.\d+)?)[°\s]*(\d+(?:\.\d+)?)?['\s]*(\d+(?:\.\d+)?)?["\s]*([NSEW])?$/;
            const match = coordStr.match(dmsRegex);
            
            if (match) {
                let deg = Math.abs(parseFloat(match[1]));
                let min = match[2] ? parseFloat(match[2]) : 0;
                let sec = match[3] ? parseFloat(match[3]) : 0;
                let dir = match[4];
                
                let dec = deg + (min / 60) + (sec / 3600);
                
                // Make negative if South, West, or manually prefixed with a minus
                if (coordStr.startsWith('-') || dir === 'S' || dir === 'W') {
                    dec = -dec;
                }
                return dec;
            }
            
            return NaN; // Failed to parse
        }

        // --- Versor Math for Globe Rotation ---
        function versor(e) {
            const l = e[0] * Math.PI / 360,
                  p = e[1] * Math.PI / 360,
                  g = e[2] ? e[2] * Math.PI / 360 : 0,
                  sl = Math.sin(l), cl = Math.cos(l),
                  sp = Math.sin(p), cp = Math.cos(p),
                  sg = Math.sin(g), cg = Math.cos(g);
            return [
                cl * cp * cg + sl * sp * sg,
                sl * cp * cg - cl * sp * sg,
                cl * sp * cg + sl * cp * sg,
                cl * cp * sg - sl * sp * cg
            ];
        }

        versor.rotation = function(q) {
            return [
                Math.atan2(2 * (q[0] * q[1] + q[2] * q[3]), 1 - 2 * (q[1] * q[1] + q[2] * q[2])) * 180 / Math.PI,
                Math.asin(Math.max(-1, Math.min(1, 2 * (q[0] * q[2] - q[3] * q[1])))) * 180 / Math.PI,
                Math.atan2(2 * (q[0] * q[3] + q[1] * q[2]), 1 - 2 * (q[2] * q[2] + q[3] * q[3])) * 180 / Math.PI
            ];
        };

        versor.interpolate = function(rotA, rotB) {
            const a = versor(rotA);
            const b = versor(rotB).slice();
            let dot = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];

            if (dot < 0) {
                for (let i = 0; i < 4; i++) b[i] = -b[i];
                dot = -dot;
            }
            if (dot > 0.9995) {
                return function(t) {
                    const q = [
                        a[0] + t * (b[0] - a[0]),
                        a[1] + t * (b[1] - a[1]),
                        a[2] + t * (b[2] - a[2]),
                        a[3] + t * (b[3] - a[3])
                    ];
                    const len = Math.sqrt(q[0]*q[0] + q[1]*q[1] + q[2]*q[2] + q[3]*q[3]);
                    return versor.rotation(q.map(x => x / len));
                };
            }

            const theta0 = Math.acos(Math.min(1, dot));
            const sinTheta0 = Math.sin(theta0);

            return function(t) {
                const theta = theta0 * t;
                const s0 = Math.cos(theta) - dot * Math.sin(theta) / sinTheta0;
                const s1 = Math.sin(theta) / sinTheta0;
                const q = [
                    a[0]*s0 + b[0]*s1,
                    a[1]*s0 + b[1]*s1,
                    a[2]*s0 + b[2]*s1,
                    a[3]*s0 + b[3]*s1
                ];
                return versor.rotation(q);
            };
        };

        // --- Core Setup ---
        const width = 1000;
        const height = 600;
        let is3D = true;
        let clickTimeout = null;

        const svg = d3.select("#map-container").append("svg")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        // --- Top 10 Most Populous Cities (2026) ---
        const topCities = [
            { name: "Shanghai", lat: 31.2304, lon: 121.4737 },
            { name: "Delhi", lat: 28.6139, lon: 77.2090 },
            { name: "Kinshasa", lat: -4.4419, lon: 15.2663 },
            { name: "Mumbai", lat: 19.0760, lon: 72.8777 },
            { name: "Beijing", lat: 39.9042, lon: 116.4074 },
            { name: "Karachi", lat: 24.8607, lon: 67.0011 },
            { name: "Shenzhen", lat: 22.5431, lon: 114.0579 },
            { name: "Guangzhou", lat: 23.1291, lon: 113.2644 },
            { name: "Kano", lat: 12.0022, lon: 8.5920 },
            { name: "Chengdu", lat: 30.5728, lon: 104.0668 }
        ];

        // Convert Cities to GeoJSON for D3 mapping
        const citiesGeoJSON = {
            type: "FeatureCollection",
            features: topCities.map(c => ({
                type: "Feature", geometry: { type: "Point", coordinates: [c.lon, c.lat] }
            }))
        };

        // Convert Antipodes to GeoJSON
        const antiCitiesGeoJSON = {
            type: "FeatureCollection",
            features: topCities.map(c => {
                let antiLon = c.lon > 0 ? c.lon - 180 : c.lon + 180;
                let antiLat = -c.lat;
                return { type: "Feature", geometry: { type: "Point", coordinates: [antiLon, antiLat] } };
            })
        };

        // --- Projections ---
        const proj3D = d3.geoOrthographic().scale(280).translate([width / 2, height / 2]);
        const projFlat = d3.geoMercator().scale(140).translate([width / 2, height / 2]);
        
        let currentProj = proj3D;
        const path3D = d3.geoPath().projection(proj3D).pointRadius(4);
        const pathFlat = d3.geoPath().projection(projFlat).pointRadius(4);

        // For the overlapping clipping effect, we use a custom matrix trick rather than math
        const projAntiFlat = d3.geoMercator().scale(140).translate([width / 2, height / 2]).rotate([180, 0, 0]);
        const pathAntiFlat = d3.geoPath().projection(projAntiFlat);

        // --- SVG Layers ---
        const defs = svg.append("defs");
        const clipPath = defs.append("clipPath").attr("id", "base-clip");
        const clipGroup = clipPath.append("g");

        const ocean = svg.append("path")
            .datum({type: "Sphere"})
            .attr("class", "sphere")
            .attr("fill", "dodgerblue")
            .attr("d", path3D);

        const graticule = d3.geoGraticule();
        const gratPath = svg.append("path")
            .datum(graticule)
            .attr("class", "graticule")
            .attr("d", path3D);

        // Core Base Layer (White Map)
        const baseLayer = svg.append("g").attr("id", "base-layer");

        // The City Dots Group (Rendered above the base map)
        const cityDots = svg.append("g").attr("id", "cities-layer");
        const antiCityDots = svg.append("g").attr("id", "anti-cities-layer");

        // Blue Antipode Background Map (Hidden in 3D)
        const antiLayer = svg.append("g")
            .attr("class", "anti-layer")
            .attr("transform", `matrix(1, 0, 0, -1, 0, ${height})`)
            .style("opacity", 0)
            .style("display", "none");

        // Orange Overlap Map (Clipped)
        const overlapLayer = svg.append("g")
            .attr("class", "anti-layer")
            .attr("clip-path", "url(#base-clip)")
            .style("opacity", 0)
            .style("display", "none")
            .append("g")
            .attr("transform", `matrix(1, 0, 0, -1, 0, ${height})`);

        const antipodeDot = svg.append("circle")
            .attr("r", 5)
            .attr("fill", "red")
            .attr("stroke", "white")
            .attr("stroke-width", 1.5)
            .style("display", "none")
            .style("pointer-events", "none");

        // --- Load Data ---
        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(function(world) {
            
            const landData = topojson.feature(world, world.objects.countries).features
                .filter(d => d.properties.name !== "Antarctica");

            const basePaths = baseLayer.selectAll("path")
                .data(landData).enter().append("path")
                .attr("fill", "white").attr("stroke", "none").attr("d", path3D);

            // Create City Paths
            const cityPaths = cityDots.selectAll("path")
                .data(citiesGeoJSON.features).enter().append("path")
                .attr("class", "city-point").attr("d", path3D);
                
            const antiCityPaths = antiCityDots.selectAll("path")
                .data(antiCitiesGeoJSON.features).enter().append("path")
                .attr("class", "anti-city-point").attr("d", path3D);

            const clipPaths = clipGroup.selectAll("path")
                .data(landData).enter().append("path").attr("d", path3D);

            const antiPaths = antiLayer.selectAll("path")
                .data(landData).enter().append("path")
                .attr("fill", "dodgerblue").attr("opacity", 0.8).attr("stroke", "none");

            const overlapPaths = overlapLayer.selectAll("path")
                .data(landData).enter().append("path")
                .attr("fill", "darkorange").attr("stroke", "none");

            // --- Interactions ---
            const drag = d3.drag()
                .on("drag", (event) => {
                    if (!is3D) return;
                    const rotate = currentProj.rotate();
                    let yaw = rotate[0] + event.dx * 0.5;
                    let pitch = rotate[1] - event.dy * 0.5;
                    
                    pitch = Math.max(-90, Math.min(90, pitch));
                    currentProj.rotate([yaw, pitch, 0]);
                    updateMap3D();
                });
            svg.call(drag);

            svg.on("mousemove", (event) => {
                const coords = currentProj.invert(d3.pointer(event));
                if (coords) {
                    let lon = coords[0];
                    lon = ((lon + 180) % 360 + 360) % 360 - 180;
                    let lat = coords[1];
                    
                    let antiLon = lon > 0 ? lon - 180 : lon + 180;
                    let antiLat = -lat;

                    let text = `Cursor: Lat ${lat.toFixed(2)}°, Lon ${lon.toFixed(2)}°`;
                    if (!is3D) {
                        text += ` &nbsp;&nbsp;|&nbsp;&nbsp; <span style="color:red">Antipode: Lat ${antiLat.toFixed(2)}°, Lon ${antiLon.toFixed(2)}°</span>`;

                        const dotPos = projFlat([antiLon, antiLat]);
                        if (dotPos) {
                            antipodeDot.attr("cx", dotPos[0]).attr("cy", dotPos[1]).style("display", "block");
                        } else {
                            antipodeDot.style("display", "none");
                        }
                    } else {
                        antipodeDot.style("display", "none");
                    }
                    document.getElementById("cursor-readout").innerHTML = text;
                } else {
                    document.getElementById("cursor-readout").innerHTML = `Cursor: Lat --, Lon --`;
                    antipodeDot.style("display", "none");
                }
            });
            
            svg.on("mouseleave", () => {
                document.getElementById("cursor-readout").innerHTML = `Cursor: Lat --, Lon --`;
                antipodeDot.style("display", "none");
            });

            svg.on("click", (event) => {
                if (clickTimeout !== null) {
                    clearTimeout(clickTimeout);
                    clickTimeout = null;
                    toggleProjection();
                } else {
                    clickTimeout = setTimeout(() => {
                        if (is3D) {
                            const coords = currentProj.invert(d3.pointer(event));
                            if (coords) {
                                executeAntipodeFlight(coords[1], coords[0]);
                            }
                        }
                        clickTimeout = null;
                    }, 250);
                }
            });

            document.getElementById("go-btn").addEventListener("click", () => {
                if (!is3D) {
                    alert("Switch to 3D sphere mode (double-click map) to fly to coordinates.");
                    return;
                }
                
                // Parse the user input using our new function
                const latStr = document.getElementById("lat-input").value;
                const lonStr = document.getElementById("lon-input").value;
                
                const lat = parseCoordinate(latStr);
                const lon = parseCoordinate(lonStr);
                
                if (!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                    executeAntipodeFlight(lat, lon);
                } else {
                    alert("Please enter valid decimal or DMS coordinates (e.g. 40° 40' 12\" N).");
                }
            });

            document.getElementById("locate-btn").addEventListener("click", () => {
                if (!is3D) {
                    alert("Switch to 3D sphere mode (double-click map) to fly to coordinates.");
                    return;
                }
                if ("geolocation" in navigator) {
                    const btn = document.getElementById("locate-btn");
                    const originalText = btn.innerText;
                    btn.innerText = "Locating...";

                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            document.getElementById("lat-input").value = lat.toFixed(4);
                            document.getElementById("lon-input").value = lon.toFixed(4);
                            btn.innerText = originalText;
                            executeAntipodeFlight(lat, lon);
                        },
                        (error) => {
                            btn.innerText = originalText;
                            alert("Could not get your location. Please ensure you granted permission to your browser.");
                        }
                    );
                } else {
                    alert("Geolocation is not supported by your browser.");
                }
            });

            // --- Rendering & Animation ---
            function updateMap3D() {
                ocean.attr("d", path3D);
                gratPath.attr("d", path3D);
                basePaths.attr("d", path3D);
                clipPaths.attr("d", path3D);
                cityPaths.attr("d", path3D);
                antiCityPaths.attr("d", path3D);
            }

            function executeAntipodeFlight(lat, lon) {
                if (lat > 89.9) lat = 90;
                if (lat < -89.9) lat = -90;

                const antiLon = lon > 0 ? lon - 180 : lon + 180;
                const antiLat = -lat;

                const currentRot = currentProj.rotate();
                const targetRot = [-antiLon, -antiLat, 0];
                const interpolator = versor.interpolate(currentRot, targetRot);

                d3.transition().duration(1200).tween("rotate", function() {
                    return function(t) {
                        currentProj.rotate(interpolator(t));
                        updateMap3D();
                    };
                });
            }

            function toggleProjection() {
                is3D = !is3D;
                currentProj = is3D ? proj3D : projFlat;
                
                if (is3D) {
                    basePaths.transition().duration(1000).attr("d", path3D);
                    clipPaths.transition().duration(1000).attr("d", path3D);
                    cityPaths.transition().duration(1000).attr("d", path3D);
                    antiCityPaths.transition().duration(1000).attr("d", path3D);
                    
                    d3.selectAll(".anti-layer").transition().duration(300).style("opacity", 0)
                        .on("end", function() { d3.select(this).style("display", "none"); });
                    
                    ocean.style("display", "block").transition().duration(1000).style("opacity", 1);
                    gratPath.style("display", "block").transition().duration(1000).attr("d", path3D).style("opacity", 1);
                    antipodeDot.style("display", "none");
                } else {
                    basePaths.transition().duration(1000).attr("d", pathFlat);
                    clipPaths.transition().duration(1000).attr("d", pathFlat);
                    cityPaths.transition().duration(1000).attr("d", pathFlat);
                    antiCityPaths.transition().duration(1000).attr("d", pathFlat);
                    
                    antiPaths.attr("d", pathAntiFlat);
                    overlapPaths.attr("d", pathAntiFlat);
                    
                    ocean.transition().duration(300).style("opacity", 0)
                        .on("end", function() { d3.select(this).style("display", "none"); });
                    gratPath.transition().duration(1000).attr("d", pathFlat).style("opacity", 0)
                        .on("end", function() { d3.select(this).style("display", "none"); });
                    
                    d3.selectAll(".anti-layer").style("display", "block")
                        .transition().delay(800).duration(500).style("opacity", 1);
                }
            }
        });
    </script>
</body>
</html>
